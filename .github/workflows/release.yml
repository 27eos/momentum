name: Release

# Builds the Windows app and publishes a GitHub Release whenever a version
# tag (e.g. v0.1.1) is pushed. electron-updater in the installed app then
# picks the new version up automatically. Uses the built-in GITHUB_TOKEN, so
# no personal token is needed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
